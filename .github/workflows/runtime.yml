name: Runtime
on:
  push:
    branches: [main]
  pull_request:
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - name: Native transport and profile discovery
        env:
          BLINK_TEST_BROWSER_SETUP: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: python -m unittest discover -s tests -p test_windows_runtime.py -v
      - name: Native CLI and MCP read/write demonstration
        run: python scripts/demo.py
      - name: Profile labels, cache and numbered selection
        run: python -m unittest discover -s tests -p test_profile_index.py -v
      - name: Automatic runtime preparation and offline reuse
        env:
          BLINK_TEST_RUNTIME_SETUP: '1'
        run: python -m unittest discover -s tests -p test_runtime_preparation.py -v
      - name: Full Linux regression suite
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -q
