[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "web-blink"
version = "0.8.0"
description = "Local, declarative Web Link integrations for Claude"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["jsonschema==4.25.1"]

[project.scripts]
web-blink = "blink.cli:main"
blink = "blink.cli:main"
blinkd = "blink.daemon:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blink = ["data/plugin/**/*.json", "data/plugin/blink-catalog.json"]
